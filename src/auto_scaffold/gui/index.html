<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Scaffold CLI GUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Auto-Scaffold GUI</h1>
    <span class="status-badge" id="connStatus">● Connected</span>
  </header>
  <main>
    <aside class="panel">
      <h2>Project</h2>
      <div class="input-group">
        <label for="folder">Folder Path</label>
        <input type="text" id="folder" placeholder="C:\Users\You\Project" value="">
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="btnScan" onclick="runScan()">🔍 Scan Project</button>
        <button class="btn btn-secondary" id="btnGenTests" onclick="runGenerateTests()" disabled>🧪 Generate Tests</button>
        <button class="btn btn-secondary" id="btnRunTests" onclick="runTests()" disabled>▶ Run Tests</button>
        <button class="btn btn-secondary" id="btnPropose" onclick="runPropose()" disabled>🔧 Propose Fixes</button>
        <button class="btn btn-primary" id="btnPipeline" onclick="runPipeline()" disabled>⚡ Full Pipeline</button>
        <button class="btn btn-danger" id="btnStop" onclick="stopAll()" disabled>⏹ Stop</button>
      </div>
    </aside>
    <section class="panel progress-section">
      <h2>Progress</h2>
      <div id="steps">
        <div class="step" data-step="scan">
          <div class="step-icon pending">1</div>
          <div class="step-content">
            <div class="step-title">Scan</div>
            <div class="step-message">Detect language & parse AST</div>
            <div class="step-progress"><div class="step-progress-bar" style="width: 0%"></div></div>
          </div>
        </div>
        <div class="step" data-step="generate">
          <div class="step-icon pending">2</div>
          <div class="step-content">
            <div class="step-title">Generate Tests</div>
            <div class="step-message">Create test files</div>
            <div class="step-progress"><div class="step-progress-bar" style="width: 0%"></div></div>
          </div>
        </div>
        <div class="step" data-step="run">
          <div class="step-icon pending">3</div>
          <div class="step-content">
            <div class="step-title">Run Tests</div>
            <div class="step-message">Execute test suite</div>
            <div class="step-progress"><div class="step-progress-bar" style="width: 0%"></div></div>
          </div>
        </div>
        <div class="step" data-step="propose">
          <div class="step-icon pending">4</div>
          <div class="step-content">
            <div class="step-title">Propose Fixes</div>
            <div class="step-message">AI generates fix proposals</div>
            <div class="step-progress"><div class="step-progress-bar" style="width: 0%"></div></div>
          </div>
        </div>
        <div class="step" data-step="review">
          <div class="step-icon pending">5</div>
          <div class="step-content">
            <div class="step-title">Review</div>
            <div class="step-message">Approve or reject proposals</div>
            <div class="step-progress"><div class="step-progress-bar" style="width: 0%"></div></div>
          </div>
        </div>
      </div>
      <div class="logs" id="logs"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
