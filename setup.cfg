[metadata]
name = auto-scaffold-cli
version = 0.1.0
description = AI agent CLI tool for automatic test generation and fix proposals
readme = README.md
license = MIT
authors = Soumya Sandeep Mishra <srm84762@gmail.com>, Swayam Krishna Sahu <swayamkrishnasahu@gmail.com>, Gourav Laxmi Sahoo <sahoogouravlaxmi@gmail.com>, Lokesh Kumar Sahu <kumarlokeshsahu42@gmail.com>
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
requires-python = >=3.11
dependencies =
    click>=8.1.0
    rich>=13.0.0
    pydantic>=2.0.0
    httpx>=0.25.0
    pyyaml>=6.0.0
    tree-sitter>=0.20.0
    tree-sitter-python>=0.20.0
    tree-sitter-javascript>=0.20.0
    tree-sitter-typescript>=0.20.0
    tree-sitter-go>=0.20.0
    tree-sitter-rust>=0.20.0
    esprima>=4.0.0
    fastapi>=0.100.0
    uvicorn>=0.23.0
    websockets>=11.0.0
    python-dotenv>=1.0.0

[options]
package_dir =
    = src
packages = find:
include_package_data = True

[options.package_data]
auto_scaffold.gui =
    *.html
    *.css
    *.js

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-mock>=3.11.0
    pytest-asyncio>=0.21.0
    ruff>=0.1.0
    mypy>=1.4.0
    black>=23.0.0
    pre-commit>=3.3.0

[options.entry_points]
console_scripts =
    auto-scaffold = auto_scaffold.cli:cli

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"